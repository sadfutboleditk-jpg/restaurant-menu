<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Restoran Menüsü"
    >

    <title>Restoran Menüsü</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            RESTAURANT
        </div>

        <div class="subtitle">
            FINE DINING MENU
        </div>

    </header>


    <!-- =====================================================
         KATEGORİLER
    ====================================================== -->

    <nav
        class="categories"
        aria-label="Menü kategorileri"
    >

        <button onclick="filterProducts('all')">
            TÜMÜ
        </button>

        <button onclick="filterProducts('Burger')">
            BURGER
        </button>

        <button onclick="filterProducts('Pizza')">
            PİZZA
        </button>

        <button onclick="filterProducts('Ana Yemek')">
            ANA YEMEK
        </button>

        <button onclick="filterProducts('Salata')">
            SALATA
        </button>

        <button onclick="filterProducts('Tatlı')">
            TATLI
        </button>

        <button onclick="filterProducts('İçecek')">
            İÇECEK
        </button>

    </nav>


    <!-- =====================================================
         ANA MENÜ
    ====================================================== -->

    <main>

        <section>

            <h2>
                MENÜ
            </h2>

            <div
                id="products"
                class="product-grid"
            >

                <!-- Ürünler JavaScript tarafından gelecek -->

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div>
            RESTAURANT
        </div>

        <small>
            Afiyet olsun
        </small>

    </footer>


    <!-- =====================================================
         ÜRÜN POPUP
    ====================================================== -->

    <div
        id="productModal"
        class="product-modal"
        aria-hidden="true"
    >

        <div
            class="product-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalProductName"
        >

            <!-- Kapat -->

            <button
                id="closeProductModal"
                class="product-modal-close"
                type="button"
                aria-label="Kapat"
            >

                &times;

            </button>


            <!-- Görsel -->

            <img
                id="modalProductImage"
                class="product-modal-image"
                src=""
                alt=""
            >


            <!-- Bilgiler -->

            <div class="product-modal-info">

                <h2 id="modalProductName">
                </h2>


                <div
                    id="modalProductCategory"
                    class="product-modal-category"
                >
                </div>


                <p
                    id="modalProductDescription"
                    class="product-modal-description"
                >
                </p>


                <div
                    id="modalProductPrice"
                    class="product-modal-price"
                >
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
