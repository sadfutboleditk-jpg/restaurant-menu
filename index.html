<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Restoran Menü"
    >

    <title>Restaurant Menu</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            RESTAURANT
        </div>

        <div class="subtitle">
            FINE DINING MENU
        </div>

    </header>



    <!-- =====================================================
         KATEGORİLER
    ====================================================== -->

    <nav
        id="categories"
        class="categories"
        aria-label="Menü kategorileri"
    >

        <!-- Kategori butonlarını script.js oluşturacak -->

    </nav>



    <!-- =====================================================
         ANA MENÜ
    ====================================================== -->

    <main>

        <section>

            <h2>
                MENÜ
            </h2>

            <div
                id="products"
                class="product-grid"
            >

                <!-- Ürünler script.js tarafından yüklenecek -->

            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div>
            RESTAURANT
        </div>

        <small>
            Afiyet olsun
        </small>

    </footer>



    <!-- =====================================================
         ÜRÜN POPUP
    ====================================================== -->

    <div
        id="productModal"
        class="product-modal"
        aria-hidden="true"
    >

        <div
            class="product-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalProductName"
        >

            <!-- Kapatma butonu -->

            <button
                id="closeProductModal"
                class="product-modal-close"
                type="button"
                aria-label="Ürünü kapat"
            >

                &times;

            </button>



            <!-- Ürün görseli -->

            <img
                id="modalProductImage"
                class="product-modal-image"
                src=""
                alt=""
            >



            <!-- Ürün bilgileri -->

            <div class="product-modal-info">

                <h2 id="modalProductName">
                </h2>


                <div
                    id="modalProductCategory"
                    class="product-modal-category"
                >
                </div>


                <p
                    id="modalProductDescription"
                    class="product-modal-description"
                >
                </p>


                <div
                    id="modalProductPrice"
                    class="product-modal-price"
                >
                </div>

            </div>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
